name: Daily Tech Internship Alerts

on:
  schedule:
    # 9:05 AM IST is 3:35 AM UTC (avoiding :00 and :30 congestion on GitHub Actions)
    - cron: '35 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'

permissions:
  contents: write # Needed to persist seen_jobs.json state

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Internship Tracker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          python tracker.py

      - name: Persist Seen Jobs State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f seen_jobs.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(cache): update seen_jobs database [skip ci]"
            git push
          else
            echo "No changes to seen_jobs.json"
          fi
